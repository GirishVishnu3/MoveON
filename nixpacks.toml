providers = ["python"]

[variables]
PYTHON_VERSION = "3.11"

[phases.install]
cmds = ["python -m venv /opt/venv", ". /opt/venv/bin/activate", "pip install -r backend/requirements.txt"]

[start]
cmd = ". /opt/venv/bin/activate && cd backend && python create_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
